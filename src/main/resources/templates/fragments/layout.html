<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:fragment="layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' — 企业员工管理系统'">企业员工管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-people-fill"></i> 企业员工管理系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/" th:classappend="${#strings.startsWith(pageTitle, '首页')} ? 'active'">
                            <i class="bi bi-house-door-fill"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/employees" th:classappend="${#strings.startsWith(pageTitle, '员工')} ? 'active'">
                            <i class="bi bi-person-badge-fill"></i> 员工管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/departments" th:classappend="${#strings.startsWith(pageTitle, '部门')} ? 'active'">
                            <i class="bi bi-building-fill"></i> 部门管理
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container my-4">
        <!-- 消息提示 -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- 页面内容 -->
        <th:block th:insert="~{::content}"/>
    </div>

    <!-- 页脚 -->
    <footer class="footer text-center">
        <div class="container">
            <small>&copy; 2026 企业员工管理系统 · Built with Spring Boot &amp; Thymeleaf</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        /* 统一的删除确认 */
        function confirmDelete(type, name, formId) {
            if (confirm('确定要删除' + type + ' "' + name + '" 吗？此操作不可撤销！')) {
                document.getElementById(formId).submit();
            }
        }
    </script>
</body>
</html>
