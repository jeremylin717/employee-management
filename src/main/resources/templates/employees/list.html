<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<body>
<div th:fragment="content">
    <!-- 页面 Hero -->
    <div class="page-hero fade-in">
        <div>
            <h2><i class="bi bi-person-badge-fill"></i> 员工管理</h2>
            <nav class="mt-2">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">首页</a></li>
                    <li class="breadcrumb-item active">员工管理</li>
                </ol>
            </nav>
        </div>
        <a href="/employees/new" class="btn btn-primary">
            <i class="bi bi-person-plus-fill me-2"></i>新增员工
        </a>
    </div>

    <!-- 搜索栏 -->
    <div class="search-card fade-in fade-in-1">
        <form th:action="@{/employees}" method="get" class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label"><i class="bi bi-building me-1"></i>部门筛选</label>
                <select name="departmentId" class="form-select">
                    <option value="">全部部门</option>
                    <option th:each="dept : ${departments}"
                            th:value="${dept.id}"
                            th:text="${dept.name}"
                            th:selected="${departmentId != null && departmentId == dept.id}"></option>
                </select>
            </div>
            <div class="col-md-5">
                <label class="form-label"><i class="bi bi-search me-1"></i>员工姓名</label>
                <input type="text" name="keyword" class="form-control"
                       th:value="${keyword}" placeholder="输入姓名搜索...">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-search me-1"></i>搜索
                </button>
            </div>
            <div class="col-md-2">
                <a href="/employees" class="btn btn-outline-secondary w-100">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>重置
                </a>
            </div>
        </form>
    </div>

    <!-- 员工列表 -->
    <div class="table-card fade-in fade-in-2">
        <!-- 空状态 -->
        <div th:if="${employees == null || employees.empty}" class="empty-state">
            <div class="empty-icon"><i class="bi bi-inbox"></i></div>
            <h5 class="text-muted mb-2">暂无员工数据</h5>
            <a href="/employees/new" class="btn btn-primary mt-2">
                <i class="bi bi-person-plus-fill me-2"></i>添加第一个员工
            </a>
        </div>

        <!-- 表格 -->
        <div th:if="${employees != null && !employees.empty}" class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>姓名</th>
                        <th>邮箱</th>
                        <th>电话</th>
                        <th>部门</th>
                        <th>职位</th>
                        <th>薪资</th>
                        <th>入职日期</th>
                        <th class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="emp : ${employees}">
                        <td><span class="text-muted fw-bold">#<span th:text="${emp.id}">1</span></span></td>
                        <td>
                            <a th:href="@{/employees/detail/{id}(id=${emp.id})}"
                               class="fw-bold text-decoration-none"><span th:text="${emp.fullName}">张三</span></a>
                        </td>
                        <td><small th:text="${emp.email}" class="text-muted"></small></td>
                        <td th:text="${emp.phone != null ? emp.phone : '-'}">-</td>
                        <td>
                            <span th:if="${emp.department != null}" class="badge-dept">
                                <a th:href="@{/departments/detail/{id}(id=${emp.department.id})}"
                                   th:text="${emp.department.name}"></a>
                            </span>
                            <span th:unless="${emp.department != null}" class="text-muted">未分配</span>
                        </td>
                        <td th:text="${emp.position != null ? emp.position : '-'}">-</td>
                        <td>
                            <span th:if="${emp.salary != null}" class="salary-highlight">
                                ¥<span th:text="${#numbers.formatDecimal(emp.salary, 1, 2)}"></span>
                            </span>
                            <span th:unless="${emp.salary != null}" class="text-muted">-</span>
                        </td>
                        <td th:text="${emp.hireDate != null ? #temporals.format(emp.hireDate, 'yyyy-MM-dd') : '-'}">-</td>
                        <td class="text-center">
                            <a th:href="@{/employees/detail/{id}(id=${emp.id})}"
                               class="btn-action btn-action-view" title="查看详情">
                                <i class="bi bi-eye-fill"></i>
                            </a>
                            <a th:href="@{/employees/edit/{id}(id=${emp.id})}"
                               class="btn-action btn-action-edit" title="编辑">
                                <i class="bi bi-pencil-fill"></i>
                            </a>
                            <button class="btn-action btn-action-delete" title="删除"
                                    th:onclick="'confirmDelete(''员工'', ''' + ${emp.fullName} + ''', ''deleteForm-' + ${emp.id} + ''')'">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                            <form th:id="'deleteForm-' + ${emp.id}"
                                  th:action="@{/employees/delete/{id}(id=${emp.id})}"
                                  method="post" style="display:none"></form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 分页 -->
    <div th:if="${totalPages > 1}" class="mt-4 fade-in fade-in-3">
        <nav>
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/employees(page=${currentPage - 1}, departmentId=${departmentId}, keyword=${keyword})}"
                       th:unless="${currentPage == 0}"><i class="bi bi-chevron-left"></i></a>
                    <span class="page-link" th:if="${currentPage == 0}"><i class="bi bi-chevron-left"></i></span>
                </li>
                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    class="page-item" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/employees(page=${i}, departmentId=${departmentId}, keyword=${keyword})}"
                       th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/employees(page=${currentPage + 1}, departmentId=${departmentId}, keyword=${keyword})}"
                       th:unless="${currentPage >= totalPages - 1}"><i class="bi bi-chevron-right"></i></a>
                    <span class="page-link" th:if="${currentPage >= totalPages - 1}"><i class="bi bi-chevron-right"></i></span>
                </li>
            </ul>
        </nav>
        <p class="pagination-info text-center mt-2">
            共 <strong th:text="${totalItems}">0</strong> 条记录，
            第 <strong th:text="${currentPage + 1}">1</strong> / <strong th:text="${totalPages}">1</strong> 页，
            每页 <strong th:text="${pageSize}">10</strong> 条
        </p>
    </div>
</div>
</body>
</html>
