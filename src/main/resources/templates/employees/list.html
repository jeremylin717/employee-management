<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<body>
<div th:fragment="content">
    <!-- 页面标题和操作栏 -->
    <div class="row mb-3">
        <div class="col-md-8">
            <h2><i class="bi bi-person-badge"></i> 员工管理</h2>
        </div>
        <div class="col-md-4 text-end">
            <a href="/employees/new" class="btn btn-primary">
                <i class="bi bi-person-plus"></i> 新增员工
            </a>
        </div>
    </div>

    <!-- 搜索栏 -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/employees}" method="get" class="row g-3">
                <div class="col-md-3">
                    <select name="departmentId" class="form-select">
                        <option value="">全部部门</option>
                        <option th:each="dept : ${departments}"
                                th:value="${dept.id}"
                                th:text="${dept.name}"
                                th:selected="${departmentId != null && departmentId == dept.id}">技术部</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <input type="text" name="keyword" class="form-control"
                           th:value="${keyword}" placeholder="输入员工姓名搜索...">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-primary w-100">
                        <i class="bi bi-search"></i> 搜索
                    </button>
                </div>
                <div class="col-md-2">
                    <a href="/employees" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-arrow-counterclockwise"></i> 重置
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- 员工列表 -->
    <div class="card">
        <div class="card-body p-0">
            <div th:if="${employees == null || employees.empty}" class="text-center p-5">
                <i class="bi bi-inbox text-muted" style="font-size: 3rem;"></i>
                <p class="mt-3 text-muted">暂无员工数据</p>
                <a href="/employees/new" class="btn btn-primary">
                    <i class="bi bi-person-plus"></i> 添加第一个员工
                </a>
            </div>

            <table th:if="${employees != null && !employees.empty}" class="table table-hover mb-0">
                <thead class="table-primary">
                    <tr>
                        <th>#</th>
                        <th>姓名</th>
                        <th>邮箱</th>
                        <th>电话</th>
                        <th>部门</th>
                        <th>职位</th>
                        <th>薪资</th>
                        <th>入职日期</th>
                        <th class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="emp, iterStat : ${employees}">
                        <td th:text="${emp.id}">1</td>
                        <td>
                            <a th:href="@{/employees/detail/{id}(id=${emp.id})}" class="fw-bold text-decoration-none"
                               th:text="${emp.fullName}">张三</a>
                        </td>
                        <td>
                            <small th:text="${emp.email}">zhangsan@example.com</small>
                        </td>
                        <td th:text="${emp.phone != null ? emp.phone : '-'}">-</td>
                        <td>
                            <span th:if="${emp.department != null}" class="badge bg-info">
                                <a th:href="@{/departments/detail/{id}(id=${emp.department.id})}" class="text-white text-decoration-none"
                                   th:text="${emp.department.name}">技术部</a>
                            </span>
                            <span th:unless="${emp.department != null}" class="text-muted">未分配</span>
                        </td>
                        <td th:text="${emp.position != null ? emp.position : '-'}">-</td>
                        <td>
                            <span th:text="${emp.salary != null ? '¥' + #numbers.formatDecimal(emp.salary, 1, 2) : '-'}">-</span>
                        </td>
                        <td th:text="${emp.hireDate != null ? #temporals.format(emp.hireDate, 'yyyy-MM-dd') : '-'}">2026-01-01</td>
                        <td class="text-center">
                            <a th:href="@{/employees/detail/{id}(id=${emp.id})}"
                               class="btn btn-sm btn-outline-info" title="查看">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/employees/edit/{id}(id=${emp.id})}"
                               class="btn btn-sm btn-outline-warning" title="编辑">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <button class="btn btn-sm btn-outline-danger" title="删除"
                                    th:onclick="|if(confirm('确定要删除员工 "${emp.fullName}" 吗？此操作不可撤销！')) { document.getElementById('deleteForm-${emp.id}').submit(); }|">
                                <i class="bi bi-trash"></i>
                            </button>
                            <form th:id="'deleteForm-' + ${emp.id}" th:action="@{/employees/delete/{id}(id=${emp.id})}" method="post" style="display:none"></form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 分页导航 -->
    <div th:if="${totalPages > 1}" class="mt-3">
        <nav>
            <ul class="pagination justify-content-center">
                <!-- 上一页 -->
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/employees(page=${currentPage - 1}, departmentId=${departmentId}, keyword=${keyword})}"
                       th:unless="${currentPage == 0}">&laquo; 上一页</a>
                    <span class="page-link" th:if="${currentPage == 0}">&laquo; 上一页</span>
                </li>

                <!-- 页码 -->
                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    class="page-item" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/employees(page=${i}, departmentId=${departmentId}, keyword=${keyword})}"
                       th:text="${i + 1}">1</a>
                </li>

                <!-- 下一页 -->
                <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/employees(page=${currentPage + 1}, departmentId=${departmentId}, keyword=${keyword})}"
                       th:unless="${currentPage >= totalPages - 1}">下一页 &raquo;</a>
                    <span class="page-link" th:if="${currentPage >= totalPages - 1}">下一页 &raquo;</span>
                </li>
            </ul>
        </nav>
        <div class="text-center text-muted mt-2">
            <small>
                共 <strong th:text="${totalItems}">0</strong> 条记录，
                第 <strong th:text="${currentPage + 1}">1</strong>/<strong th:text="${totalPages}">1</strong> 页，
                每页 <strong th:text="${pageSize}">10</strong> 条
            </small>
        </div>
    </div>
</div>
</body>
</html>
