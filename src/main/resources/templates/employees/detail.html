<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<body>
<div th:fragment="content">
    <!-- 页面 Hero -->
    <div class="page-hero fade-in">
        <div>
            <h2><i class="bi bi-person-badge-fill"></i> 员工详情</h2>
            <nav class="mt-2">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">首页</a></li>
                    <li class="breadcrumb-item"><a href="/employees">员工管理</a></li>
                    <li class="breadcrumb-item active" th:text="${employee.fullName}"></li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="row g-4">
        <!-- 基本信息 -->
        <div class="col-lg-6 fade-in fade-in-1">
            <div class="detail-card">
                <div class="detail-header header-primary">
                    <i class="bi bi-person-fill"></i> 基本信息
                </div>
                <table class="detail-table">
                    <tr>
                        <th>员工编号</th>
                        <td><span class="badge bg-primary" th:text="'#' + ${employee.id}">#1</span></td>
                    </tr>
                    <tr>
                        <th>姓名</th>
                        <td class="fw-bold fs-5" th:text="${employee.fullName}"></td>
                    </tr>
                    <tr>
                        <th>邮箱</th>
                        <td>
                            <a th:href="'mailto:' + ${employee.email}" th:text="${employee.email}" class="text-decoration-none"></a>
                        </td>
                    </tr>
                    <tr>
                        <th>电话</th>
                        <td th:text="${employee.phone != null ? employee.phone : '未填写'}"></td>
                    </tr>
                    <tr>
                        <th>创建时间</th>
                        <td th:text="${#temporals.format(employee.createdDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    </tr>
                    <tr th:if="${employee.updatedDate != null}">
                        <th>最后更新</th>
                        <td th:text="${#temporals.format(employee.updatedDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    </tr>
                </table>
            </div>
        </div>

        <!-- 工作信息 -->
        <div class="col-lg-6 fade-in fade-in-2">
            <div class="detail-card">
                <div class="detail-header header-info">
                    <i class="bi bi-briefcase-fill"></i> 工作信息
                </div>
                <table class="detail-table">
                    <tr>
                        <th>所属部门</th>
                        <td>
                            <span th:if="${employee.department != null}">
                                <a th:href="@{/departments/detail/{id}(id=${employee.department.id})}" class="badge-dept text-decoration-none">
                                    <i class="bi bi-building me-1"></i><span th:text="${employee.department.name}"></span>
                                </a>
                            </span>
                            <span th:unless="${employee.department != null}" class="text-muted">未分配</span>
                        </td>
                    </tr>
                    <tr>
                        <th>职位</th>
                        <td th:text="${employee.position != null ? employee.position : '未填写'}"></td>
                    </tr>
                    <tr>
                        <th>薪资</th>
                        <td>
                            <span th:if="${employee.salary != null}" class="salary-highlight fs-5">
                                ¥<span th:text="${#numbers.formatDecimal(employee.salary, 1, 2)}"></span>
                            </span>
                            <span th:unless="${employee.salary != null}" class="text-muted">未填写</span>
                        </td>
                    </tr>
                    <tr>
                        <th>入职日期</th>
                        <td>
                            <span th:if="${employee.hireDate != null}" th:text="${#temporals.format(employee.hireDate, 'yyyy-MM-dd')}"></span>
                            <span th:unless="${employee.hireDate != null}" class="text-muted">未填写</span>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <!-- 操作按钮 -->
    <div class="mt-4 d-flex gap-2 fade-in fade-in-3">
        <a th:href="@{/employees/edit/{id}(id=${employee.id})}" class="btn btn-warning">
            <i class="bi bi-pencil-fill me-1"></i>编辑
        </a>
        <button class="btn btn-danger"
                th:onclick="'confirmDelete(''员工'', ''' + ${employee.fullName} + ''', ''deleteForm'')'">
            <i class="bi bi-trash-fill me-1"></i>删除
        </button>
        <form id="deleteForm" th:action="@{/employees/delete/{id}(id=${employee.id})}" method="post" style="display:none"></form>
        <a href="/employees" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>返回列表
        </a>
    </div>
</div>
</body>
</html>
