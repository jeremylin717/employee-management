<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<body>
<div th:fragment="content">
    <!-- 页面标题 -->
    <div class="row mb-4">
        <div class="col-12">
            <h2><i class="bi bi-person-badge"></i> 员工详情</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">首页</a></li>
                    <li class="breadcrumb-item"><a href="/employees">员工管理</a></li>
                    <li class="breadcrumb-item active" th:text="${employee.fullName}">员工详情</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="row g-4">
        <!-- 基本信息 -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <i class="bi bi-person"></i> 基本信息
                </div>
                <div class="card-body">
                    <table class="table table-borderless">
                        <tr>
                            <th class="w-25 text-muted">员工编号</th>
                            <td th:text="${employee.id}">1</td>
                        </tr>
                        <tr>
                            <th class="text-muted">姓名</th>
                            <td class="fw-bold" th:text="${employee.fullName}">张三</td>
                        </tr>
                        <tr>
                            <th class="text-muted">邮箱</th>
                            <td>
                                <a th:href="'mailto:' + ${employee.email}" th:text="${employee.email}">email@example.com</a>
                            </td>
                        </tr>
                        <tr>
                            <th class="text-muted">电话</th>
                            <td th:text="${employee.phone != null ? employee.phone : '未填写'}">-</td>
                        </tr>
                        <tr>
                            <th class="text-muted">创建时间</th>
                            <td th:text="${#temporals.format(employee.createdDate, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01</td>
                        </tr>
                        <tr th:if="${employee.updatedDate != null}">
                            <th class="text-muted">最后更新</th>
                            <td th:text="${#temporals.format(employee.updatedDate, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>

        <!-- 工作信息 -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-info text-white">
                    <i class="bi bi-briefcase"></i> 工作信息
                </div>
                <div class="card-body">
                    <table class="table table-borderless">
                        <tr>
                            <th class="w-25 text-muted">所属部门</th>
                            <td>
                                <span th:if="${employee.department != null}">
                                    <a th:href="@{/departments/detail/{id}(id=${employee.department.id})}" class="text-decoration-none">
                                        <span class="badge bg-info" th:text="${employee.department.name}">技术部</span>
                                    </a>
                                </span>
                                <span th:unless="${employee.department != null}" class="text-muted">未分配</span>
                            </td>
                        </tr>
                        <tr>
                            <th class="text-muted">职位</th>
                            <td th:text="${employee.position != null ? employee.position : '未填写'}">-</td>
                        </tr>
                        <tr>
                            <th class="text-muted">薪资</th>
                            <td>
                                <span th:if="${employee.salary != null}" class="fw-bold text-success">
                                    ¥<span th:text="${#numbers.formatDecimal(employee.salary, 1, 2)}">0.00</span>
                                </span>
                                <span th:unless="${employee.salary != null}" class="text-muted">未填写</span>
                            </td>
                        </tr>
                        <tr>
                            <th class="text-muted">入职日期</th>
                            <td>
                                <span th:if="${employee.hireDate != null}"
                                      th:text="${#temporals.format(employee.hireDate, 'yyyy-MM-dd')}">2026-01-01</span>
                                <span th:unless="${employee.hireDate != null}" class="text-muted">未填写</span>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 操作按钮 -->
    <div class="mt-4">
        <a th:href="@{/employees/edit/{id}(id=${employee.id})}" class="btn btn-warning">
            <i class="bi bi-pencil"></i> 编辑
        </a>
        <button class="btn btn-danger"
                th:onclick="|if(confirm('确定要删除员工 "${employee.fullName}" 吗？此操作不可撤销！')) { document.getElementById('deleteForm').submit(); }|">
            <i class="bi bi-trash"></i> 删除
        </button>
        <form id="deleteForm" th:action="@{/employees/delete/{id}(id=${employee.id})}" method="post" style="display:none"></form>
        <a href="/employees" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> 返回列表
        </a>
    </div>
</div>
</body>
</html>
