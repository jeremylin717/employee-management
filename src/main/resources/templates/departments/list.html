<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<body>
<div th:fragment="content">
    <!-- 页面 Hero -->
    <div class="page-hero fade-in">
        <div>
            <h2><i class="bi bi-building-fill"></i> 部门管理</h2>
            <nav class="mt-2">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">首页</a></li>
                    <li class="breadcrumb-item active">部门管理</li>
                </ol>
            </nav>
        </div>
        <a href="/departments/new" class="btn btn-primary">
            <i class="bi bi-plus-lg me-2"></i>新增部门
        </a>
    </div>

    <!-- 搜索栏 -->
    <div class="search-card fade-in fade-in-1">
        <form th:action="@{/departments}" method="get" class="row g-3 align-items-end">
            <div class="col-md-9">
                <label class="form-label"><i class="bi bi-search me-1"></i>部门名称</label>
                <input type="text" name="keyword" class="form-control"
                       th:value="${keyword}" placeholder="输入部门名称搜索...">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-search me-1"></i>搜索
                </button>
            </div>
        </form>
    </div>

    <!-- 部门卡片网格 -->
    <div class="row g-4 fade-in fade-in-2">
        <!-- 空状态 -->
        <div th:if="${departments == null || departments.empty}" class="col-12">
            <div class="table-card">
                <div class="empty-state">
                    <div class="empty-icon"><i class="bi bi-inbox"></i></div>
                    <h5 class="text-muted mb-2">暂无部门数据</h5>
                    <a href="/departments/new" class="btn btn-primary mt-2">
                        <i class="bi bi-plus-lg me-2"></i>新增第一个部门
                    </a>
                </div>
            </div>
        </div>

        <!-- 部门卡片 -->
        <div class="col-lg-4 col-md-6" th:each="dept : ${departments}">
            <div class="card h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h5 class="fw-bold mb-1">
                                <a th:href="@{/departments/detail/{id}(id=${dept.id})}"
                                   class="text-decoration-none" th:text="${dept.name}"></a>
                            </h5>
                            <small class="text-muted">
                                <i class="bi bi-calendar3 me-1"></i>
                                <span th:text="${#temporals.format(dept.createdDate, 'yyyy-MM-dd')}"></span>
                            </small>
                        </div>
                        <span class="badge rounded-pill fs-6" style="background:linear-gradient(135deg,#6366f1,#4f46e5)"
                              th:text="${dept.employeeCount} + ' 人'">0人</span>
                    </div>
                    <p class="text-muted small mb-3" style="min-height:2.5rem"
                       th:text="${dept.description != null ? #strings.abbreviate(dept.description, 60) : '暂无描述'}"></p>
                    <div class="d-flex gap-2">
                        <a th:href="@{/departments/detail/{id}(id=${dept.id})}"
                           class="btn btn-sm btn-outline-info flex-grow-1">
                            <i class="bi bi-eye-fill me-1"></i>查看
                        </a>
                        <a th:href="@{/departments/edit/{id}(id=${dept.id})}"
                           class="btn btn-sm btn-outline-warning">
                            <i class="bi bi-pencil-fill"></i>
                        </a>
                        <button class="btn btn-sm btn-outline-danger"
                                th:onclick="'confirmDelete(''部门'', ''' + ${dept.name} + ''', ''deleteForm-' + ${dept.id} + ''')'">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                        <form th:id="'deleteForm-' + ${dept.id}"
                              th:action="@{/departments/delete/{id}(id=${dept.id})}"
                              method="post" style="display:none"></form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
