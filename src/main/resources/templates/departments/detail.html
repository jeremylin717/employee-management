<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout}">
<body>
<div th:fragment="content">
    <!-- 页面 Hero -->
    <div class="page-hero fade-in">
        <div>
            <h2><i class="bi bi-building-fill"></i> 部门详情</h2>
            <nav class="mt-2">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">首页</a></li>
                    <li class="breadcrumb-item"><a href="/departments">部门管理</a></li>
                    <li class="breadcrumb-item active" th:text="${department.name}"></li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="row g-4">
        <!-- 部门信息 -->
        <div class="col-lg-5 fade-in fade-in-1">
            <div class="detail-card">
                <div class="detail-header header-primary">
                    <i class="bi bi-info-circle-fill"></i> 部门信息
                </div>
                <table class="detail-table">
                    <tr>
                        <th>部门编号</th>
                        <td><span class="badge bg-primary" th:text="'#' + ${department.id}">#1</span></td>
                    </tr>
                    <tr>
                        <th>部门名称</th>
                        <td class="fw-bold fs-5" th:text="${department.name}"></td>
                    </tr>
                    <tr>
                        <th>描述</th>
                        <td th:text="${department.description != null ? department.description : '暂无描述'}"></td>
                    </tr>
                    <tr>
                        <th>创建时间</th>
                        <td th:text="${#temporals.format(department.createdDate, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    </tr>
                    <tr>
                        <th>员工数量</th>
                        <td>
                            <span class="badge rounded-pill fs-6" style="background:linear-gradient(135deg,#6366f1,#4f46e5)"
                                  th:text="${department.employeeCount} + ' 人'">0人</span>
                        </td>
                    </tr>
                </table>
            </div>

            <!-- 操作按钮 -->
            <div class="mt-3 d-flex gap-2 fade-in fade-in-3">
                <a th:href="@{/departments/edit/{id}(id=${department.id})}" class="btn btn-warning">
                    <i class="bi bi-pencil-fill me-1"></i>编辑
                </a>
                <button class="btn btn-danger"
                        th:onclick="'confirmDelete(''部门'', ''' + ${department.name} + ''', ''deleteForm'')'">
                    <i class="bi bi-trash-fill me-1"></i>删除
                </button>
                <form id="deleteForm" th:action="@{/departments/delete/{id}(id=${department.id})}" method="post" style="display:none"></form>
                <a href="/departments" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>返回列表
                </a>
            </div>
        </div>

        <!-- 部门员工 -->
        <div class="col-lg-7 fade-in fade-in-2">
            <div class="detail-card">
                <div class="detail-header header-info">
                    <i class="bi bi-people-fill"></i> 部门员工
                    <span class="badge bg-white text-dark ms-2" th:text="${department.employeeCount}">0</span>
                </div>
                <div th:if="${department.employees == null || department.employees.empty}" class="card-body">
                    <div class="empty-state py-4">
                        <div class="empty-icon"><i class="bi bi-person-x"></i></div>
                        <p class="text-muted mb-3">该部门暂无员工</p>
                        <a th:href="@{/employees/new}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-person-plus-fill me-1"></i>添加员工
                        </a>
                    </div>
                </div>
                <ul th:if="${department.employees != null && !department.employees.empty}"
                    class="list-group list-group-flush employee-mini-list">
                    <li th:each="emp : ${department.employees}"
                        class="list-group-item d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-3">
                            <div class="rounded-circle bg-primary bg-opacity-10 d-flex align-items-center justify-content-center"
                                 style="width:42px;height:42px">
                                <i class="bi bi-person-fill text-primary"></i>
                            </div>
                            <div>
                                <a th:href="@{/employees/detail/{id}(id=${emp.id})}" class="fw-bold text-decoration-none"
                                   th:text="${emp.fullName}"></a>
                                <div class="small text-muted" th:text="${emp.position != null ? emp.position : '未设置职位'}"></div>
                            </div>
                        </div>
                        <span class="badge bg-light text-muted" th:text="${emp.email}"></span>
                    </li>
                </ul>
                <div th:if="${department.employees != null && !department.employees.empty}" class="card-footer bg-white text-center">
                    <a th:href="@{/employees(departmentId=${department.id})}" class="btn btn-sm btn-outline-info">
                        <i class="bi bi-arrow-right me-1"></i>查看全部员工
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
