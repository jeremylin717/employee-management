# ==================== 应用配置 ====================
spring.application.name=employee-management
server.port=${PORT:8088}

# ==================== MySQL 数据库配置 ====================
# 本地开发：直接使用下面的值
# 云部署：通过环境变量覆盖 SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA / Hibernate 配置 ====================
# 首次部署用 update，上线后改为 validate 或 none
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==================== Thymeleaf 配置 ====================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ==================== 日志配置 ====================
logging.level.com.example.employeemanagement=DEBUG
logging.level.org.hibernate.SQL=WARN
